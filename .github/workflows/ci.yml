name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace @voicebridge/api --workspace @voicebridge/web --include-workspace-root --no-audit --no-fund
      - run: npm run typecheck:api
      - run: npm run test:api
      - run: npm run test:web
      - run: npm run build:api
      - run: npm run build:web
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace @voicebridge/mobile --include-workspace-root --no-audit --no-fund
      - run: npm run typecheck:mobile
