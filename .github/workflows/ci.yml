name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package.json
      - run: npm install
        working-directory: apps/api
      - run: npm run typecheck
        working-directory: apps/api
      - run: npm run build
        working-directory: apps/api

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package.json
      - run: npm install
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile
