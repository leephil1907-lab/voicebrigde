services:
  - type: web
    name: voicebridge
    runtime: docker
    plan: pro
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: http://localhost:8081,http://localhost:3000
      - key: SUPABASE_URL
        value: https://kggllnqkryquornprphu.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_MrQ2VG45f2ZgRqZ7EoKKdg_UnrAglRi
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_CURRENCY
        value: NGN
      - key: PAYSTACK_APP_URL
        value: https://voicebridge-81xs.onrender.com
      - key: PAYSTACK_CREDIT_PACKAGES_JSON
        value: "[]"
      - key: PAYSTACK_SUBSCRIPTION_PLANS_JSON
        value: "[]"
      # Optional messaging variables can be added later in the Render dashboard.
      - key: SUPABASE_STORAGE_BUCKET
        value: voicebridge-private
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: MAX_AUDIO_BYTES
        value: "20971520"
      - key: MAX_AUDIO_SECONDS
        value: "120"
      - key: MAX_TRANSLATIONS_PER_USER_PER_DAY
        value: "3"
