services:
  - type: web
    name: voicebridge
    runtime: docker
    plan: pro
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: http://localhost:8081,http://localhost:3000
      - key: SUPABASE_URL
        value: https://kggllnqkryquornprphu.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_MrQ2VG45f2ZgRqZ7EoKKdg_UnrAglRi
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_GRAPH_API_VERSION
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: VOICEBRIDGE_ALLOWED_USER_IDS
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: voicebridge-private
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: MAX_AUDIO_BYTES
        value: "20971520"
      - key: MAX_AUDIO_SECONDS
        value: "120"
      - key: MAX_TRANSLATIONS_PER_USER_PER_DAY
        value: "3"
