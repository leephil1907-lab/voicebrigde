services:
  - type: web
    name: voicebridge
    runtime: docker
    plan: pro
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: https://voicebridge-81xs.onrender.com
      - key: SUPABASE_URL
        value: https://kggllnqkryquornprphu.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_MrQ2VG45f2ZgRqZ7EoKKdg_UnrAglRi
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_CURRENCY
        value: NGN
      - key: PAYSTACK_APP_URL
        value: https://voicebridge-81xs.onrender.com
      - key: PAYSTACK_CREDIT_PACKAGES_JSON
        value: '[{"code":"starter","name":"Starter","description":"1 translation minute · one-time top-up","amountMinor":750000,"credits":60},{"code":"growth","name":"Growth","description":"5 translation minutes · one-time top-up","amountMinor":3500000,"credits":300},{"code":"power","name":"Power","description":"10 translation minutes · one-time top-up","amountMinor":6500000,"credits":600}]'
      # Set this in the Render dashboard after creating matching plans in Paystack.
      - key: PAYSTACK_SUBSCRIPTION_PLANS_JSON
        sync: false
      # Optional messaging variables can be added later in the Render dashboard.
      - key: SUPABASE_STORAGE_BUCKET
        value: voicebridge-private
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: MAX_AUDIO_BYTES
        value: "20971520"
      - key: MAX_AUDIO_SECONDS
        value: "120"
      - key: MAX_TRANSLATIONS_PER_USER_PER_DAY
        value: "100"
